name: N.O.V.A. Doctor Agent CI

# Covers spec section 25: install -> pytest -> benchmark smoke -> adversarial -> build submission
# -> standalone smoke -> source-sync verification. Scoped to nova_agent/competition/evaluation/
# submission/tests -- never touches frontend/3D-anatomy/Jetson assets (out of scope for this
# competition agent; see README.md's Directory structure section).
#
# Two jobs, deliberately separated:
#   - nova-agent: the normal dev-mode job. Always runs, always uses the default mock provider,
#     and must stay green regardless of whether any real-LLM secret is configured. Its own
#     "Competition preflight" step is informational only (`|| true`) -- NOT READY under mock is
#     expected, never a failure.
#   - competition-readiness: SKIPPED entirely (not failed) when no real provider secret is
#     configured. Once any secret IS configured, it runs preflight_competition.py and
#     smoke_real_llm.py for real, with NO `|| true` -- a real-LLM problem here fails CI, it is
#     never silently masked.

on:
  push:
    branches: [main, "claude/**", "kiro/**"]
  pull_request:
    # Run on PRs targeting main OR the integration branch used for staged delivery, so each
    # stage PR gets real CI before it is merged upward.
    branches: [main, "claude/**"]
  workflow_dispatch: {}

jobs:
  nova-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nova_agent runtime + dev dependencies
        run: |
          pip install -r requirements-nova.txt
          pip install -r requirements-nova-dev.txt

      - name: Evaluation leakage scan (no blind-set phrase/answer leaked into the agent core)
        run: python scripts/check_eval_leakage.py

      - name: pytest (nova_agent + competition adapter + safety regression)
        # Scope to the nova_agent/competition/evaluation tests only. The tests/test_production_*.py
        # files exercise the standalone production/ FastAPI package and require fastapi/httpx, which
        # this mock-provider job deliberately does NOT install (it installs pydantic-only
        # requirements-nova.txt); they have their own `production` job below with the right deps.
        # Without this exclusion, pytest's collection imports test_production_api.py and fails on a
        # missing fastapi before any nova_agent test runs.
        run: python -m pytest tests/ -v --ignore=tests/test_production_api.py --ignore=tests/test_production_repository.py --ignore=tests/test_production_reliability.py --ignore=tests/test_production_units.py

      - name: Benchmark (tuning + held-out + generalization-v2 + stress sets)
        run: python -m evaluation.benchmark --generalization-v2 --stress

      - name: Generalization benchmark
        run: python -m evaluation.generalization_benchmark

      - name: Ablation
        run: python -m evaluation.ablation

      - name: Adversarial / reliability checks
        run: python -m evaluation.adversarial

      - name: Stability (run-to-run determinism)
        run: python -m evaluation.stability --runs 3 --cases 4

      - name: Verify README.md benchmark numbers are not stale
        run: |
          python -m evaluation.benchmark --generalization-v2 --stress --save-json evaluation/latest_results.json
          python scripts/check_readme_numbers.py

      - name: Build submission (validates requirements, secret scan, standalone smoke test, zip+manifest)
        run: python scripts/build_nova_submission.py

      - name: Verify submission/ is in sync with nova_agent/ + competition/ (fails on drift)
        run: python -m pytest tests/test_safety_regression.py::test_submission_source_sync -v

      # Informational only here -- this job always runs under the default mock provider, so NOT
      # READY is expected and never blocks it. The enforcing check lives in the
      # competition-readiness job below, gated on real secrets actually being configured.
      - name: Competition preflight (informational, expected NOT READY under mock)
        run: python scripts/preflight_competition.py || true

      - name: Upload submission.zip
        uses: actions/upload-artifact@v4
        with:
          name: nova-submission
          path: submission/submission.zip
          retention-days: 14

  # GitHub Actions does not allow the `secrets` context inside a job-level `if:` condition (the
  # whole workflow file fails to even parse if you try -- confirmed the hard way: the run showed
  # 0 jobs and its displayed name fell back to the file path, the classic signature of an invalid
  # workflow file). The documented workaround: read secrets into an ordinary step's `env:` (that
  # IS allowed) and expose a plain job output, which `if:` CAN reference via `needs.*.outputs`.
  check-competition-secrets:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          NOVA_LLM_PROVIDER: ${{ secrets.NOVA_LLM_PROVIDER }}
          NOVA_LLM_BASE_URL: ${{ secrets.NOVA_LLM_BASE_URL }}
          NOVA_LLM_API_KEY: ${{ secrets.NOVA_LLM_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOVA_COMPETITION_BASE_URL: ${{ secrets.NOVA_COMPETITION_BASE_URL }}
          NOVA_COMPETITION_API_KEY: ${{ secrets.NOVA_COMPETITION_API_KEY }}
        run: |
          if [ -n "$NOVA_LLM_PROVIDER" ] || [ -n "$NOVA_LLM_BASE_URL" ] || \
             [ -n "$NOVA_LLM_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ] || \
             [ -n "$NOVA_COMPETITION_BASE_URL" ] || [ -n "$NOVA_COMPETITION_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  # Deliberately a SEPARATE job, not a step in nova-agent above: this job's checks are only
  # meaningful once real competition secrets exist, and only THIS job is allowed to fail CI over a
  # real-LLM problem. nova-agent above never touches real secrets and must stay green under the
  # default mock provider regardless of whether this job passes, fails, or is skipped.
  competition-readiness:
    needs: [nova-agent, check-competition-secrets]
    runs-on: ubuntu-latest
    # Skips cleanly (not a failure) when no real provider secret is configured at all -- a normal
    # PR against this repo (no secrets set) never sees this job as red. Once ANY of these secrets
    # IS configured, this job runs for real and its failures are NOT masked with `|| true`.
    if: needs.check-competition-secrets.outputs.configured == 'true'
    env:
      NOVA_LLM_PROVIDER: ${{ secrets.NOVA_LLM_PROVIDER }}
      NOVA_LLM_BASE_URL: ${{ secrets.NOVA_LLM_BASE_URL }}
      NOVA_LLM_MODEL: ${{ secrets.NOVA_LLM_MODEL }}
      NOVA_LLM_API_KEY: ${{ secrets.NOVA_LLM_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NOVA_COMPETITION_BASE_URL: ${{ secrets.NOVA_COMPETITION_BASE_URL }}
      NOVA_COMPETITION_MODEL: ${{ secrets.NOVA_COMPETITION_MODEL }}
      NOVA_COMPETITION_API_KEY: ${{ secrets.NOVA_COMPETITION_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nova_agent runtime + dev dependencies
        run: |
          pip install -r requirements-nova.txt
          pip install -r requirements-nova-dev.txt

      - name: Competition preflight (real secrets configured -- must report READY)
        run: python scripts/preflight_competition.py

      - name: Real-LLM smoke test (real secrets configured -- must succeed, not just fall back)
        run: python scripts/smoke_real_llm.py

  # Deliberately a SEPARATE job from both of the above: production/ has its own dependency surface
  # (FastAPI/uvicorn on top of nova_agent's runtime deps -- see production/requirements.txt) and is
  # never referenced by scripts/build_nova_submission.py, so a production-only failure here must
  # never block or gate the competition submission artifact, and vice versa.
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install production API dependencies (nova_agent runtime + FastAPI/uvicorn)
        run: |
          pip install -r production/requirements.txt
          pip install -r requirements-nova-dev.txt
          # starlette.testclient (used by tests/test_production_api.py via FastAPI's TestClient)
          # requires httpx at TEST time only -- it is deliberately NOT in production/requirements.txt
          # (runtime deps only). Install it here so the production API tests can run.
          pip install "httpx>=0.28,<1"

      - name: Production unit + integration + concurrency + failure-injection tests
        run: python -m pytest tests/test_production_api.py tests/test_production_repository.py tests/test_production_reliability.py tests/test_production_units.py -v

      - name: Load smoke (throughput / latency / error-rate / memory-growth regression guard)
        run: python scripts/load_smoke.py --cases 150 --concurrency 15 --max-p95-ms 3000

      - name: Build production container image
        run: docker build -f production/Dockerfile -t nova-doctor-agent:ci -t nova-doctor-agent:${{ github.sha }} .

      - name: Container smoke test (start container, hit /health and /ready, stop it)
        run: |
          # production/ is the REFERENCE / lightweight standalone deployment (its repository is
          # in-memory by design -- see production/repository.py; the durable, Postgres-backed
          # hospital production path is backend/, covered by the production-backend and
          # postgres-integration jobs). The image's Dockerfile defaults NOVA_ENV=production, whose
          # startup guard correctly refuses to start with a non-durable store; for a start-and-serve
          # health smoke of the reference image we run it in a non-production env (staging) with auth
          # disabled, so /ready reflects the image serving, not a hospital-durability assertion this
          # reference package intentionally does not make.
          docker run -d --name nova-prod-smoke -p 18080:8000 \
            -e NOVA_ENV=staging -e NOVA_REQUIRE_AUTH=false nova-doctor-agent:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:18080/health > /dev/null; then echo "health OK"; break; fi
            if [ "$i" -eq 20 ]; then echo "container never became healthy"; docker logs nova-prod-smoke; exit 1; fi
            sleep 1
          done
          curl -sf http://localhost:18080/ready | tee /tmp/ready.json
          python -c "import json,sys; d=json.load(open('/tmp/ready.json')); sys.exit(0 if d['ready'] else 1)"
          docker rm -f nova-prod-smoke

  # Fully independent of `production` above (the standalone production/ package's own API) and of
  # nova-agent/competition-readiness: this job covers N.O.V.A.'s OTHER production path -- backend/,
  # which integrates nova_agent into this repo's existing SynexAgent FastAPI app (FHIR/OIDC/SMART/
  # RBAC/audit reuse -- see backend/app/services/nova_service.py, docs/NOVA_PRODUCTION_ARCHITECTURE.md).
  # A failure here never blocks the competition submission pipeline, and vice versa.
  production-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies (includes nova_agent's pydantic requirement)
        run: pip install -r backend/requirements-dev.txt

      - name: Backend + N.O.V.A. integration tests (lifecycle, RBAC, concurrency, idempotency, FHIR mapper, reliability)
        run: python -m pytest backend/tests/ -v

      - name: N.O.V.A. load smoke (throughput / latency / error-rate / memory-growth regression guard)
        run: python scripts/load_smoke_backend.py --cases 100 --concurrency 10 --max-p95-ms 3000

      - name: Build production backend container image (includes nova_agent/, frontend/)
        run: docker build -f docker/Dockerfile -t nova-synexagent:ci -t nova-synexagent:${{ github.sha }} .

      - name: Container smoke test (start container, hit /health and /ready, stop it)
        run: |
          docker run -d --name nova-backend-smoke -p 18090:8000 nova-synexagent:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18090/health > /dev/null; then echo "health OK"; break; fi
            if [ "$i" -eq 30 ]; then echo "container never became healthy"; docker logs nova-backend-smoke; exit 1; fi
            sleep 1
          done
          curl -sf http://localhost:18090/ready | tee /tmp/backend-ready.json
          # Default container env (AUTH_MODE=demo/EMR_MODE=demo/NOVA_LLM_PROVIDER=mock, no NOVA_ENV)
          # is dev-shaped by design -- /ready must report true here; production_guard.py's stricter
          # gate only activates under NOVA_ENV=production, exercised by the pytest suite above, not
          # by this smoke test's default container env.
          python -c "import json,sys; d=json.load(open('/tmp/backend-ready.json')); sys.exit(0 if d['ready'] else 1)"
          docker rm -f nova-backend-smoke


  # Frontend build + pure unit tests (R14.3). Deliberately independent of every backend job: it
  # needs no Python, no backend, and no database. The `test:unit` script uses vitest.unit.config.js
  # (tests/setup.unit.js) which does NOT spawn the Python API bridge that the default vitest config
  # uses, so it runs green in CI without a live backend. A full browser E2E against a running
  # backend is a separate concern (see the staged E2E work) and is intentionally not gated here to
  # avoid a flaky job that would need the whole backend + Postgres stack stood up first.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build (vite production build must succeed)
        run: npm run build

      - name: Unit tests (i18n + N.O.V.A. components, no backend needed)
        run: npm run test:unit

  # Postgres integration (R14.2): runs the Postgres-backed repository/concurrency/audit/migration
  # tests against a REAL postgres:16 service -- never a mock. NOVA_CI_REQUIRE_POSTGRES=1 makes
  # backend/tests/conftest.py turn a would-be Postgres skip into a hard FAILURE, so a broken (or
  # never-run) database integration goes red instead of silently passing as "production-ready".
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nova_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NOVA_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/nova_test
      NOVA_CI_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies (includes psycopg)
        run: pip install -r backend/requirements-dev.txt

      - name: Postgres integration tests (repository, concurrency, audit, migrations) -- skip == FAIL
        run: |
          python -m pytest \
            backend/tests/test_nova_postgres_repository.py \
            backend/tests/test_nova_postgres_concurrency.py \
            backend/tests/test_audit_postgres.py \
            backend/tests/test_nova_migrations.py -v
