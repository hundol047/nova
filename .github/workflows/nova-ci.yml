name: N.O.V.A. Doctor Agent CI

# Covers spec section 25: install -> pytest -> benchmark smoke -> adversarial -> build submission
# -> standalone smoke -> source-sync verification. Scoped to nova_agent/competition/evaluation/
# submission/tests -- never touches frontend/3D-anatomy/Jetson assets (out of scope for this
# competition agent; see README.md's Directory structure section).
#
# Two jobs, deliberately separated:
#   - nova-agent: the normal dev-mode job. Always runs, always uses the default mock provider,
#     and must stay green regardless of whether any real-LLM secret is configured. Its own
#     "Competition preflight" step is informational only (`|| true`) -- NOT READY under mock is
#     expected, never a failure.
#   - competition-readiness: SKIPPED entirely (not failed) when no real provider secret is
#     configured. Once any secret IS configured, it runs preflight_competition.py and
#     smoke_real_llm.py for real, with NO `|| true` -- a real-LLM problem here fails CI, it is
#     never silently masked.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  nova-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nova_agent runtime + dev dependencies
        run: |
          pip install -r requirements-nova.txt
          pip install -r requirements-nova-dev.txt

      - name: pytest (nova_agent + competition adapter + safety regression)
        run: python -m pytest tests/ -v

      - name: Benchmark (tuning + held-out + generalization-v2 + stress sets)
        run: python -m evaluation.benchmark --generalization-v2 --stress

      - name: Generalization benchmark
        run: python -m evaluation.generalization_benchmark

      - name: Ablation
        run: python -m evaluation.ablation

      - name: Adversarial / reliability checks
        run: python -m evaluation.adversarial

      - name: Stability (run-to-run determinism)
        run: python -m evaluation.stability --runs 3 --cases 4

      - name: Verify README.md benchmark numbers are not stale
        run: |
          python -m evaluation.benchmark --generalization-v2 --stress --save-json evaluation/latest_results.json
          python scripts/check_readme_numbers.py

      - name: Build submission (validates requirements, secret scan, standalone smoke test, zip+manifest)
        run: python scripts/build_nova_submission.py

      - name: Verify submission/ is in sync with nova_agent/ + competition/ (fails on drift)
        run: python -m pytest tests/test_safety_regression.py::test_submission_source_sync -v

      # Informational only here -- this job always runs under the default mock provider, so NOT
      # READY is expected and never blocks it. The enforcing check lives in the
      # competition-readiness job below, gated on real secrets actually being configured.
      - name: Competition preflight (informational, expected NOT READY under mock)
        run: python scripts/preflight_competition.py || true

      - name: Upload submission.zip
        uses: actions/upload-artifact@v4
        with:
          name: nova-submission
          path: submission/submission.zip
          retention-days: 14

  # GitHub Actions does not allow the `secrets` context inside a job-level `if:` condition (the
  # whole workflow file fails to even parse if you try -- confirmed the hard way: the run showed
  # 0 jobs and its displayed name fell back to the file path, the classic signature of an invalid
  # workflow file). The documented workaround: read secrets into an ordinary step's `env:` (that
  # IS allowed) and expose a plain job output, which `if:` CAN reference via `needs.*.outputs`.
  check-competition-secrets:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          NOVA_LLM_PROVIDER: ${{ secrets.NOVA_LLM_PROVIDER }}
          NOVA_LLM_BASE_URL: ${{ secrets.NOVA_LLM_BASE_URL }}
          NOVA_LLM_API_KEY: ${{ secrets.NOVA_LLM_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOVA_COMPETITION_BASE_URL: ${{ secrets.NOVA_COMPETITION_BASE_URL }}
          NOVA_COMPETITION_API_KEY: ${{ secrets.NOVA_COMPETITION_API_KEY }}
        run: |
          if [ -n "$NOVA_LLM_PROVIDER" ] || [ -n "$NOVA_LLM_BASE_URL" ] || \
             [ -n "$NOVA_LLM_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ] || \
             [ -n "$NOVA_COMPETITION_BASE_URL" ] || [ -n "$NOVA_COMPETITION_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  # Deliberately a SEPARATE job, not a step in nova-agent above: this job's checks are only
  # meaningful once real competition secrets exist, and only THIS job is allowed to fail CI over a
  # real-LLM problem. nova-agent above never touches real secrets and must stay green under the
  # default mock provider regardless of whether this job passes, fails, or is skipped.
  competition-readiness:
    needs: [nova-agent, check-competition-secrets]
    runs-on: ubuntu-latest
    # Skips cleanly (not a failure) when no real provider secret is configured at all -- a normal
    # PR against this repo (no secrets set) never sees this job as red. Once ANY of these secrets
    # IS configured, this job runs for real and its failures are NOT masked with `|| true`.
    if: needs.check-competition-secrets.outputs.configured == 'true'
    env:
      NOVA_LLM_PROVIDER: ${{ secrets.NOVA_LLM_PROVIDER }}
      NOVA_LLM_BASE_URL: ${{ secrets.NOVA_LLM_BASE_URL }}
      NOVA_LLM_MODEL: ${{ secrets.NOVA_LLM_MODEL }}
      NOVA_LLM_API_KEY: ${{ secrets.NOVA_LLM_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NOVA_COMPETITION_BASE_URL: ${{ secrets.NOVA_COMPETITION_BASE_URL }}
      NOVA_COMPETITION_MODEL: ${{ secrets.NOVA_COMPETITION_MODEL }}
      NOVA_COMPETITION_API_KEY: ${{ secrets.NOVA_COMPETITION_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nova_agent runtime + dev dependencies
        run: |
          pip install -r requirements-nova.txt
          pip install -r requirements-nova-dev.txt

      - name: Competition preflight (real secrets configured -- must report READY)
        run: python scripts/preflight_competition.py

      - name: Real-LLM smoke test (real secrets configured -- must succeed, not just fall back)
        run: python scripts/smoke_real_llm.py

  # Deliberately a SEPARATE job from both of the above: production/ has its own dependency surface
  # (FastAPI/uvicorn on top of nova_agent's runtime deps -- see production/requirements.txt) and is
  # never referenced by scripts/build_nova_submission.py, so a production-only failure here must
  # never block or gate the competition submission artifact, and vice versa.
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install production API dependencies (nova_agent runtime + FastAPI/uvicorn)
        run: |
          pip install -r production/requirements.txt
          pip install -r requirements-nova-dev.txt

      - name: Production unit + integration + concurrency + failure-injection tests
        run: python -m pytest tests/test_production_api.py tests/test_production_repository.py tests/test_production_reliability.py tests/test_production_units.py -v

      - name: Load smoke (throughput / latency / error-rate / memory-growth regression guard)
        run: python scripts/load_smoke.py --cases 150 --concurrency 15 --max-p95-ms 3000

      - name: Build production container image
        run: docker build -f production/Dockerfile -t nova-doctor-agent:ci -t nova-doctor-agent:${{ github.sha }} .

      - name: Container smoke test (start container, hit /health and /ready, stop it)
        run: |
          docker run -d --name nova-prod-smoke -p 18080:8000 -e NOVA_REQUIRE_AUTH=false nova-doctor-agent:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:18080/health > /dev/null; then echo "health OK"; break; fi
            if [ "$i" -eq 20 ]; then echo "container never became healthy"; docker logs nova-prod-smoke; exit 1; fi
            sleep 1
          done
          curl -sf http://localhost:18080/ready | tee /tmp/ready.json
          python -c "import json,sys; d=json.load(open('/tmp/ready.json')); sys.exit(0 if d['ready'] else 1)"
          docker rm -f nova-prod-smoke
